name: ci

# Build and test the thesun subsystems across Linux, macOS, and Windows.
#   - gateway (Node): the MCP mux / security policy enforcement point (PEP). OS-sensitive
#     because it exercises the approvals.json / grants.json store under %AppData%\thesun on Windows.
#   - fleet/fleetd (Go): the process supervisor. OS-sensitive because it exercises the Windows
#     TCP-loopback + token control channel.
#   - generator (Node): the REST-to-MCP generator. OS-agnostic, so it runs on Linux only.
# hermes is intentionally excluded here: it is a separate pnpm workspace owned by another
# workstream. The gateway is npm/package-lock managed (npm ci), NOT pnpm.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  gateway:
    name: gateway (Node)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      # Runs the full vitest suite, including test/e2e/escalation.test.ts
      # (the earlier Windows-only exclusion is gone; the test passes clean).
      - name: test
        run: npm test

  fleetd:
    name: fleetd (Go)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fleet/fleetd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: fleet/fleetd/go.sum

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

  generator:
    name: generator (Node, ubuntu-latest)
    runs-on: ubuntu-latest
    # This job gates like the others. It was previously continue-on-error because
    # the credential store was an external dependency referenced by a local
    # filesystem path outside the repo, so `npm ci` could not resolve it in a clean
    # checkout. The module is now vendored at generator/src/security/vault-store.ts,
    # so a clean install succeeds and a generator failure must break CI.
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: generator/package-lock.json

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      - name: test
        run: npm test
